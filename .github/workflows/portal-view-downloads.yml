name: Portal View release downloads

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  downloads:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install release test dependency
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Check source snapshot and release contracts with ambient proxies
        run: |
          python3 -B - <<'PYTHON'
          import os
          import subprocess
          import sys
          proxy = 'http://127.0.0.1:9'
          for name in ('http_proxy', 'https_proxy', 'all_proxy'):
              os.environ[name] = os.environ[name.upper()] = proxy
          os.environ['no_proxy'] = os.environ['NO_PROXY'] = ''
          subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover',
                          '-s', 'scripts', '-p', 'test_portal_view*.py'], check=True)
          PYTHON
