name: Validate event deltas

on:
  pull_request:
    paths:
      - "events/**"
      - "scripts/validate-event-deltas.sh"
      - ".github/workflows/validate-event-deltas.yml"
  push:
    branches:
      - master
    paths:
      - "events/**"
      - "scripts/validate-event-deltas.sh"
      - ".github/workflows/validate-event-deltas.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded graph events
        run: scripts/validate-event-deltas.sh
